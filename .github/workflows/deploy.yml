name: Deploy Backend to AWS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{secrets.AWS_REGION}}
  AWS_ACCOUNT_ID: ${{secrets.AWS_ACCOUNT_ID}}

jobs:
  main-service-test:
    name: Main Service Test
    runs-on: ubuntu-latest

    steps:
      - name: Main service code checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Execute Tests
        working-directory: ./backend/main-service
        run: mvn clean verify

  email-service-test:
    name: Email Service Test
    runs-on: ubuntu-latest

    steps:
      - name: Email service code checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Execute Tests
        working-directory: ./backend/email-service
        run: mvn clean verify

  build-and-push:
    name: Build and Push to ECR
    needs: [email-service-test, main-service-test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{secrets.AWS_ROLE_ARN}}
          aws-region: ${{env.AWS_REGION}}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          MAIN_REPOSITORY: ${{ secrets.ECR_REPOSITORY_MAIN }}
          EMAIL_REPOSITORY: ${{ secrets.ECR_REPOSITORY_EMAIL }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$MAIN_REPOSITORY:$IMAGE_TAG \
            ./backend/main-service
          
          docker push $REGISTRY/$MAIN_REPOSITORY:$IMAGE_TAG
          
          docker build \
            -t $REGISTRY/$EMAIL_REPOSITORY:$IMAGE_TAG \
            ./backend/email-service
          
          docker push $REGISTRY/$EMAIL_REPOSITORY:$IMAGE_TAG

  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create directories
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            mkdir -p \
              /home/ubuntu/bittencourt-academy \
              /home/ubuntu/bittencourt-academy/rabbitmq

      - name: Upload docker-compose
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/home/ubuntu/bittencourt-academy"

      - name: Upload rabbitmq
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "backend/rabbitmq"
          target: "/home/ubuntu/bittencourt-academy"

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password \
              --region ${{ secrets.AWS_REGION }} \
            | docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            SECRET_JSON=$(aws secretsmanager get-secret-value \
            --secret-id bittencourt-academy/prod \
            --query SecretString \
            --output text)
            
            eval "$(python3 -c '
            import sys, json, shlex
            try:
              data = json.loads(sys.argv[1])
              for k, v in data.items():
                print(f"export {k}={shlex.quote(str(v))}")
            except Exception as e:
              print(f"echo \"Erro ao parsear JSON: {e}\"", file=sys.stderr)
              ' "$SECRET_JSON")"
            
            export ECR_REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com"
            export IMAGE_TAG=${{ github.sha }}
  
            cd /home/ubuntu/bittencourt-academy
                    
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
                    
            docker image prune -f