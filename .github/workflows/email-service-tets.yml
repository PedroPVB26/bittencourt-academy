name: Build & Tests
on:
  push:
    branches:
      - main
    paths:
      - 'backend/email-service/**'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/email-service/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Configure Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Execute Tests
        working-directory: ./backend/email-service
        run: mvn clean verify