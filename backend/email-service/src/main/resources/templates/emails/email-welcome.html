<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Bittencourt Academy</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #000926;
            font-family: 'Inter', sans-serif;
            color: #F8FAFC;
        }

        .email-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #0F1935;
            border: 1px solid #263354;
            border-radius: 12px;
            overflow: hidden;
        }

        .header {
            padding: 30px;
            background-color: #3F4FFD;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: #F8FAFC;
            font-size: 26px;
        }

        .content {
            padding: 35px;
        }

        .content p {
            color: #F8FAFC;
            font-size: 15px;
            line-height: 1.6;
        }

        .greeting {
            margin: 0 0 20px;
            font-size: 16px !important;
        }

        .description {
            margin: 0 0 18px;
        }

        .call-to-action {
            margin: 0 0 25px;
        }

        .button-container {
            text-align: center;
        }

        .button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #3F4FFD;
            color: #F8FAFC !important;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }

        .footer {
            padding: 20px 35px;
            background-color: #0C142C;
            border-top: 1px solid #263354;
        }

        .footer p {
            margin: 0;
            color: #AAB4D6;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>
<div class="email-container">

    <div class="header">
        <h1>Welcome to Bittencourt Academy!</h1>
    </div>

    <div class="content">
        <p class="greeting">
            Hello <strong th:text="${userName}">Pedro Bittencourt!</strong>,
        </p>

        <p class="description">
            Welcome to Bittencourt Academy! Your account has been successfully created.
        </p>

        <p class="call-to-action">
            You're now ready to explore our courses and start your learning journey.
        </p>

        <div class="button-container">
            <a class="button" href="#">
                Explore Courses
            </a>
        </div>
    </div>

    <div class="footer">
        <p>
            Bittencourt Academy &copy; 2026
        </p>
    </div>

</div>
</body>
</html>
