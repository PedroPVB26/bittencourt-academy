services:

  # ==== POSTGRES ====
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


  # ==== RABBITMQ ====
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./backend/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    restart: unless-stopped

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  # ==== RABBITMQ INIT ====
  rabbitmq-init:
    image: rabbitmq:4-management

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - ./backend/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for RabbitMQ management API..."

        until rabbitmqadmin \
          --host rabbitmq \
          --port 15672 \
          --username "$$RABBITMQ_DEFAULT_USER" \
          --password "$$RABBITMQ_DEFAULT_PASS" \
          show overview > /dev/null 2>&1
        do
          sleep 2
        done

        echo "RabbitMQ is ready."

        rabbitmqadmin \
          --host rabbitmq \
          --port 15672 \
          --username "$$RABBITMQ_DEFAULT_USER" \
          --password "$$RABBITMQ_DEFAULT_PASS" \
          definitions import \
          --file /etc/rabbitmq/definitions.json

        echo "RabbitMQ definitions imported successfully."


  # ==== MAIN SERVICE ====
  main-service:
    build: backend/main-service

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}

      BACKEND_URL: http://localhost:8080
      FRONTEND_URL: http://localhost:4200

    ports:
      - "${MAIN_SERVICE_PORT}:8080"

    depends_on:
      postgres:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # ==== EMAIL SERVICE ====
  email-service:
    build: backend/email-service

    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USERNAME: ${EMAIL_USERNAME}

    ports:
      - "${EMAIL_SERVICE_PORT}:8081"

    depends_on:
      rabbitmq-init:
        condition: service_completed_successfully

    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data: