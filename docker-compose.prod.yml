services:

  # ==== POSTGRES ====
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: bittencourt_academy
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


  # ==== RABBITMQ ====
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ==== RABBITMQ INIT ====
  rabbitmq-init:
    image: rabbitmq:4-management

    depends_on:
      rabbitmq:
        condition: service_healthy

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}

    volumes:
      - ./backend/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro

    command:
      - /bin/sh
      - -c
      - |
        echo "Waiting for RabbitMQ management API..."

        until rabbitmqadmin \
          --host rabbitmq \
          --port 15672 \
          --username "$$RABBITMQ_DEFAULT_USER" \
          --password "$$RABBITMQ_DEFAULT_PASS" \
          show overview > /dev/null 2>&1
        do
          sleep 2
        done

        echo "RabbitMQ is ready."

        rabbitmqadmin \
          --host rabbitmq \
          --port 15672 \
          --username "$$RABBITMQ_DEFAULT_USER" \
          --password "$$RABBITMQ_DEFAULT_PASS" \
          definitions import \
          --file /etc/rabbitmq/definitions.json

        echo "RabbitMQ definitions imported successfully."
        

  # ==== MAIN SERVICE ====
  main-service:
    image: ${ECR_REGISTRY}/bittencourt-academy/main-service:${IMAGE_TAG}

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bittencourt_academy
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      GOOGLE_CLIENT_ID: 222977515590-2qfesui15dkm9r537vdlb5j1s7um02fh.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET: ${JWT_SECRET}

      BACKEND_URL: https://api.bittencourt-academy.com
      FRONTEND_URL: https://www.bittencourt-academy.com

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_started
      rabbitmq-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # ==== EMAIL SERVICE ====
  email-service:
    image: ${ECR_REGISTRY}/bittencourt-academy/email-service:${IMAGE_TAG}

    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}

      EMAIL_HOST: smtp.gmail.com
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
      EMAIL_PORT: 587
      EMAIL_USERNAME: ${EMAIL_USERNAME}

    ports:
      - "8081:8081"

    rabbitmq-init:
      condition: service_completed_successfully

    restart: unless-stopped


volumes:
  postgres_data:
  rabbitmq_data: