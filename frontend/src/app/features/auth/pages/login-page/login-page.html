<form [formGroup]="form" (ngSubmit)="submit()">

  <app-primary-input
    label="Email"
    placeholder="Type your email"
    type="email"
    formControlName="email"
    inputName="email">
  </app-primary-input>

  <app-primary-input
    label="Senha"
    placeholder="Type your password"
    type="password"
    formControlName="password"
    inputName="password">
  </app-primary-input>

  <button type="submit">
    Entrar
  </button>

</form>
