<app-auth-layout>

  <app-auth-card>

    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="form-label">
        <h2>Create your account</h2>
        <span>It is fast and free!</span>
      </div>

      <app-primary-input label="Full Name" placeholder="John Smith" type="text" formControlName="fullName"
        inputName="fullName">
        <span leading-icon class="material-symbols-outlined">
          mail
        </span>
      </app-primary-input>

      <app-primary-input label="E-mail" placeholder="john.smith@example.com" type="email" formControlName="email"
        inputName="email">
        <span leading-icon class="material-symbols-outlined">
          mail
        </span>
      </app-primary-input>

      <app-primary-input label="Password" placeholder="At least 8 characters" type="password"
        hint="Must contain uppercase, lowercase and a number" formControlName="password" inputName="password">
        <span leading-icon class="material-symbols-outlined">
          lock
        </span>
        <span trailing-icon class="material-symbols-outlined">
          visibility
        </span>
      </app-primary-input>

      <app-primary-input label="Confirm Password" placeholder="Repeat your password" type="password"
        hint="Must match the password above" formControlName="confirmPassword" inputName="confirmPassword">
        <span leading-icon class="material-symbols-outlined">
          lock
        </span>
      </app-primary-input>

      <app-primary-button label="Sign Up" type="submit" [disabled]="form.invalid"
        [loading]="isRegistering"></app-primary-button>
      <!-- <app-primary-button label="Sign Up" buttonStyle="secondary"></app-primary-button> -->

      <div class="divider">
        <div></div>
        <span>or</span>
        <div></div>
      </div>

      <app-primary-button (click)="continueWithGoogle()" label="Continue with Google" type="button"
        buttonStyle="secondary" [loading]="isGoogleLoading"> <img leading-icon src="/icons/google.svg" alt="Google" width="25"
          height="25"></app-primary-button>

      <a routerLink="/auth/login" class="text-button">
        Already have an account? <span>Log in</span>
      </a>
    </form>

  </app-auth-card>

</app-auth-layout>
